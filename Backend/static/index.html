<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Band Live</title>
<style>
  :root {
    --bg: #f6f4ef; --panel: #ffffff; --ink: #1d1f24; --muted: #6b6f78; --line: #e4e0d6;
    --accent: #2f6f62; --accent-soft: #e3efeb; --warn: #b4532a; --warn-soft: #f8e6dc;
    --family: #5a4fa3; --family-soft: #ebe8f7; --chip: #f0ede6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171b; --panel: #1e2126; --ink: #eceae4; --muted: #9a9ea8; --line: #2d3138;
      --accent: #6cc3ad; --accent-soft: #1f3530; --warn: #f0a077; --warn-soft: #3a2820;
      --family: #aea4f0; --family-soft: #2a2740; --chip: #272a31;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
           padding: 16px 20px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  h1 small { font-weight: 400; color: var(--muted); font-size: 14px; margin-left: 8px; }
  .status { display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .pill { background: var(--chip); border-radius: 999px; padding: 3px 10px; }
  .pill.on { background: var(--accent-soft); color: var(--accent); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
           border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  button:hover { border-color: var(--accent); }
  form { display: flex; gap: 8px; flex: 1 1 320px; }
  input { flex: 1; font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
          background: var(--panel); color: var(--ink); min-width: 0; }
  .lines { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 20px 12px; border-bottom: 1px solid var(--line); }
  .lines button { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--chip); border-color: transparent; }
  main { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; padding: 16px 20px 40px; }
  @media (max-width: 1100px) { main { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px) { main { grid-template-columns: 1fr; padding: 12px 16px 32px; }
                              header, .controls, .lines { padding-left: 16px; padding-right: 16px; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-height: 240px;
            display: flex; flex-direction: column; overflow: hidden; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
               margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  ol { list-style: none; margin: 0; padding: 8px; display: flex; flex-direction: column-reverse; gap: 6px;
       overflow-y: auto; max-height: 70vh; }
  li { padding: 8px 10px; border-radius: 8px; background: var(--bg); animation: pop .35s ease-out; }
  li time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; margin-right: 6px; }
  li .tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px;
            background: var(--accent-soft); color: var(--accent); margin-right: 6px; }
  li .quote { color: var(--muted); font-size: 13px; display: block; margin-top: 2px; }
  li.nudge { background: var(--warn-soft); }
  li.nudge.answer { background: var(--accent-soft); }
  li.family { background: var(--family-soft); }
  li.resolved { opacity: 0.55; }
  li .rule { font-size: 12px; color: var(--muted); display: block; margin-top: 2px; }
  .empty { color: var(--muted); padding: 14px; font-size: 14px; }
  @keyframes pop { from { transform: translateY(-4px); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<header>
  <h1>Memory Band <small>live: what was heard, what it meant, what we said</small></h1>
  <div class="status">
    <span class="pill" id="conn">connecting…</span>
    <span class="pill" id="ai">AI</span>
    <span class="pill" id="voice">voice</span>
    <span class="pill" id="due">pill due —</span>
  </div>
</header>

<div class="controls">
  <button class="primary" id="start">Start demo (pill due in 2 min)</button>
  <button id="sound">Voice: off</button>
  <button id="reset">Clear</button>
  <form id="say">
    <input id="text" placeholder="Type what the wearer says, like “okay, locking up”" autocomplete="off">
    <button>Say</button>
  </form>
</div>
<div class="lines" id="lines"></div>

<main>
  <section><h2>Heard by the band</h2><ol id="transcripts"></ol></section>
  <section><h2>Memory timeline</h2><ol id="events"></ol></section>
  <section><h2>Spoken to Margaret</h2><ol id="wearer"></ol></section>
  <section><h2>Family alerts</h2><ol id="family"></ol></section>
</main>

<script>
const DEMO_LINES = [
  "can we get the check?", "thank you, have a good day", "got my phone and my wallet",
  "I'm heading out to the store", "okay, locking up", "taking my blood pressure pill",
  "time for my pill", "did I lock the door?", "I'll leave my glasses on the kitchen table",
  "where are my glasses?", "let me put the kettle on",
];
const LABELS = {
  pill_taken: "pill taken", pill_intent: "about to take pill", pill_repeat: "second dose (warned)",
  door_locked: "door locked", leaving_home: "leaving home", check_requested: "asked for the check",
  goodbye: "saying goodbye", item_confirmed: "has item", item_placed: "put item down",
  stove_on: "stove on", stove_off: "stove off", question: "question",
};
const $ = (id) => document.getElementById(id);
const seen = new Set();
let voiceOn = false;
const speakQueue = [];
let speaking = false;

const time = (ts) => new Date(ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function add(list, html, cls, id) {
  const el = document.createElement("li");
  if (cls) el.className = cls;
  if (id) el.id = id;
  el.innerHTML = html;
  $(list).appendChild(el);
}

function render(kind, row, live) {
  const key = kind + ":" + row.id;
  if (seen.has(key)) return;
  seen.add(key);
  if (kind === "transcript") {
    add("transcripts", `<time>${time(row.ts)}</time>${esc(row.text)}`);
  } else if (kind === "event") {
    if (row.type === "question") return;
    const extra = row.item ? `: ${esc(row.item)}${row.place ? " → " + esc(row.place) : ""}` : "";
    add("events", `<time>${time(row.ts)}</time><span class="tag">${esc(LABELS[row.type] || row.type)}${extra}</span>
      <span class="quote">“${esc(row.quote)}”${row.detector === "ai" ? " · AI" : ""}</span>`, "", "event-" + row.id);
  } else if (kind === "nudge") {
    const fam = row.audience === "family";
    add(fam ? "family" : "wearer",
      `<time>${time(row.ts)}</time>${esc(row.text)}<span class="rule">${esc(row.rule.replaceAll("_", " "))}</span>`,
      (fam ? "family" : "nudge" + (row.rule === "answer" ? " answer" : "")) + (row.resolved ? " resolved" : ""),
      "nudge-" + row.id);
    if (!fam && live) say(row);
  }
}

function say(row) {
  if (!voiceOn) return;
  speakQueue.push(row);
  if (!speaking) next();
}

async function next() {
  const row = speakQueue.shift();
  if (!row) { speaking = false; return; }
  speaking = true;
  try {
    const r = await fetch(`/nudges/${row.id}/audio`);
    if (!r.ok) throw new Error("no voice");
    const audio = new Audio(URL.createObjectURL(await r.blob()));
    audio.onended = next;
    audio.onerror = next;
    await audio.play();
  } catch (e) {          // no ElevenLabs key: the browser's own voice
    const u = new SpeechSynthesisUtterance(row.text);
    u.rate = 0.92;
    u.onend = next;
    u.onerror = next;
    speechSynthesis.speak(u);
  }
}

function showConfig(cfg) {
  const p = cfg && cfg.pills && cfg.pills[0];
  if (!p) return;
  const due = p.due.length > 5 ? time(p.due) : p.due;
  $("due").textContent = `pill due ${due}`;
}

async function load() {
  const s = await (await fetch("/state")).json();
  ["transcripts", "events", "wearer", "family"].forEach((id) => ($(id).innerHTML = ""));
  seen.clear();
  s.transcripts.forEach((r) => render("transcript", r));
  s.events.forEach((r) => render("event", r));
  s.nudges.forEach((r) => render("nudge", r));
  showConfig(s.config);
  const h = await (await fetch("/health")).json();
  $("ai").textContent = h.ai ? "AI detector on" : "keywords only";
  $("ai").classList.toggle("on", h.ai);
  $("voice").textContent = h.voice ? "ElevenLabs voice" : "browser voice";
  $("voice").classList.toggle("on", h.voice);
}

function connect() {
  const es = new EventSource("/stream");
  es.addEventListener("hello", () => { $("conn").textContent = "live"; $("conn").classList.add("on"); load(); });
  es.onmessage = (m) => {
    const { kind, row } = JSON.parse(m.data);
    if (kind === "reset") return load();
    if (kind === "config") return showConfig(row);
    if (kind === "event_changed") {
      const el = $("event-" + row.id);
      if (el) el.querySelector(".tag").textContent = LABELS[row.type] || row.type;
      return;
    }
    if (kind === "resolved") {
      document.querySelectorAll("#wearer li:not(.resolved)").forEach((el) => {
        if (!row.rule || el.querySelector(".rule").textContent === row.rule.replaceAll("_", " ")) el.classList.add("resolved");
      });
      return;
    }
    render(kind, row, true);
  };
  es.onerror = () => { $("conn").textContent = "reconnecting…"; $("conn").classList.remove("on"); };
}

async function post(url, body) {
  return fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
}

function enableVoice() {
  voiceOn = true;
  $("sound").textContent = "Voice: on";
  speechSynthesis.speak(new SpeechSynthesisUtterance(""));   // unlocks audio after a click
}

$("start").onclick = async () => { enableVoice(); await post("/demo/start", { pill_in_min: 2 }); };
$("sound").onclick = () => {
  if (voiceOn) { voiceOn = false; $("sound").textContent = "Voice: off"; speechSynthesis.cancel(); }
  else enableVoice();
};
$("reset").onclick = () => post("/demo/reset");
$("say").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  $("text").value = "";
  await post("/transcripts", { text, source: "typed" });
};
DEMO_LINES.forEach((line) => {
  const b = document.createElement("button");
  b.textContent = line;
  b.onclick = () => post("/transcripts", { text: line, source: "typed" });
  $("lines").appendChild(b);
});
connect();
</script>
</body>
</html>
